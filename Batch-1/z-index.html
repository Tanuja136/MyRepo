<html>

<head>
    <title>Z-index</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        .red-box {
            height: 200px;
            width: 200px;
            background-color: red;
            position: relative;
            z-index: 200;
        }

        .blue-box {
            height: 200px;
            width: 200px;
            background-color: blue;
            position: relative;
            top:-100px;
            left:100px;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <div class="red-box"></div>
    <div class="blue-box">
    <i class="fa-brands fa-apple-pay" >Pay Here</i>
</div>
</body>

</html>
