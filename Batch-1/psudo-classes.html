<html>
    <head>
        <title>Psudo classes</title>
        <style>
            body {
                margin-left: 400px;
                margin-top: 100px;
            }
            .container {
                height: 200px;
                width: 200px;
                background-color: antiquewhite;
                padding: 20px;
                border: 2px solid palevioletred;
                border-radius: 10px;
            }
            .btn1 {
                background-color: rgb(40, 131, 211);
                padding: 5px;
                border-radius: 10px;
                margin-left: 70px;
            }
            .btn1:hover {
                background-color: aqua;
            }
            .btn2:active {
                background-color: red;
            }
            input:focus {
                background-color: greenyellow;
                color: yellow;
            }
            a:visited {
                color: orange;
            }
        </style>
    </head>
    <body>
        <form class="container">
            <input type="text" placeholder="Enter name" /> <br><br>
            <input type="tel" placeholder="Enter number"/> <br><br>
            <button class="btn1">Submit</button>
            <button class="btn2">Reset</button>
            <a href="google.com">click me</a>
        </form>
    </body>
</html>
