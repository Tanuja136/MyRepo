<html>
    <head>
        <title>Division Tag Example</title>
        <style> 
            body {
                background-color: lightblue;
                margin-left: 600px;
            }

            div {
                height: 200px;
                width: 400px;
                border: 2px solid black;
                background-color: rgb(241, 233, 233);
            }
           

            .card {
                height: 400px;
                width: 400px;
                border: 2px solid black;
                background-color: rgb(189, 245, 241);
                margin-top: 20px;
                /* padding-left: 20px; */
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div>
            <h1>This is a heading inside a div</h1>
            <p>This is a paragraph inside the same div.</p>
        </div>

        <div class="card">
            <h1 style="color: #007bff; text-align: center;">Aditya University</h1>
            <h6>Tanuja</h6>
            <p>2387677887</p>
            <p>32/67/7778</p>
            <p>Mobile No. : 9876543210</p>
        </div>

    </body>
</html>
