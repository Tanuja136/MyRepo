<html>
<head>
    <title>Forms</title>
</head>

<body>

    <form>


        <label>Enter Your Name:</label>

        <input 
            type="text"
            placeholder="Enter your name"
            required
        >

        <br><br>














        <!-- Number -->

        <label>Phone Number:</label>

        <input 
            type="tel"
            maxlength="10"
            placeholder="Enter phone number"
            autofocus
        >

        <br><br>














        <!-- Password -->

        <label>Password:</label>

        <input 
            type="password"
            placeholder="Enter password"
        >

        <br><br>
















        <!-- Email -->

        <label>Email:</label>

        <input 
            type="email"
            placeholder="Enter email"
        >

        <br><br>













        <!-- Date -->

        <label>Date of Birth:</label>

        <input type="date">

        <br><br>

        <label>time:</label>
        <input type="time">
        <br><br>



















        <!-- Radio -->

        <label>Gender:</label>

        <input 
            type="radio"
            name="gender"
        >Male

        <input 
            type="radio"
            name="gender"
        >Female

        <br><br>













        <!-- Checkbox -->

        <label>Skills:</label>

        <input type="checkbox">HTML

        <input type="checkbox">CSS

        <input type="checkbox">JavaScript

        <br><br>














        <!-- Select -->

        <label>Select Course:</label>

        <select>

            <option>selct course</option>
            <option>ECE</option>
            <option>CSE</option>

        </select>

        <br><br>















        <!-- Textarea -->

        <label>Address:</label><br>
        <textarea rows="5" cols="10" minlength="10" maxlength="10" placeholder="Enter your address"></textarea>

        <br><br>













        <!-- File -->

        <label>Upload File:</label>

        <input type="file">

        <br><br>












        <!-- Range -->

        <label>Range:</label>

        <input type="range">

        <br><br>










        <!-- Value -->

        <label>Value:</label>

        <input 
            type="text"
            value="Ram"
        >

        <br><br>









        <!-- Readonly -->

        <label>Readonly:</label>

        <input 
            type="text"
            value="Admin"
            readonly
        >

        <br><br>










        <!-- Submit -->

        <input type="submit">








        <!-- Reset -->

        <input type="reset">







    </form>
</body>

</html>
