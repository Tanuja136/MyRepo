<html>
    <head>
        <title>Selectors</title>
        <style>
            *{
                color : white
            }
            .container {
                height : 400px;
                width : 400px;
                background-color : lightblue;
            }
            h1 {
                color : red;
            }
            #description {
                color : yellow;
            }
            li::marker{
                color : yellow;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Selectors</h1>
            <p id="description">There are 4 types of selectors in CSS:</p>
            <h2 id="description">There are 4 types of selectors in CSS:</h2>
            <ul>
                <li>Element Selector</li>
                <li>Class Selector</li>
                <li>ID Selector</li>
                <li>Universal Selector</li>
            </ul>
        </div>
        <div>
            <h6 id="description" >Hello, World!</h6>
        </div>
    </body>
</html>
