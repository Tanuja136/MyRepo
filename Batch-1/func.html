<html>

<head>
    <title>traffic signal</title>
</head>

<body>
    <script>

        let num = 153;

        let original = num;
        let sum = 0;

        while (num > 0) {

            let rem = num % 10; //153 % 10 = 3 , 5, 1

            sum = sum + (rem * rem * rem); // 0+(3*3*3) = 27, 152,153

            num = (num - rem) / 10; // 153-3 = 150 / 10 = 15, 10/10 = 1

        }

        if (sum == original) {
            console.log("Armstrong Number");
        } else {
            console.log("Not Armstrong Number");
        }

    </script>
</body>

</html>
