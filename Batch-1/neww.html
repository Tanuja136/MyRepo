<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Classes</title>

    <style>

        h1{
            text-align:center;
        }

        .container{
            width:300px;
            margin:auto;
            padding:20px;
            border:2px solid black;
            border-radius:10px;
            background-color:lightblue;
        }

        input{
            width:90%;
            padding:10px;
        }

        input:focus{
            background-color:yellow;
        }

        button{
            padding:10px 20px;
            background-color:blue;
            color:white;
            border:none;
            border-radius:5px;
        }

        button:hover{
            background-color:red;
        }

        button:active{
            background-color:green;
        }

        a{
            color:blue;
        }

        .visited1:visited {
            color:rgb(182, 11, 182);
        }
            

    </style>

</head>
<body>

    <div class="container">

        <h1>Login Form</h1>

        <label>Username:</label><br>
        <input type="text">

        <br><br>

        <label>Password:</label><br>
        <input type="password">

        <br><br>

        <button>Login</button>

        <br><br>

        

        <a href="example.html" target="_blank" class="visited1">
            Visit Example
        </a>

    </div>

</body>
</html>
