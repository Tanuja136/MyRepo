<html>
    <head>
        <title>Forms</title>
    </head>
    <body>
        <form>
            <label>Enter Your Name:</label>
            <input type="text" name="text" placeholder="Enter your name" autofocus>

            <br><br>

            <label>Phone Number:</label>
            <input type="tel" value="+91" readonly> -
            <input type="tel" name="phone" placeholder="Enter your phone number" maxlength="10" minlength="10>

            <br><br>

            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter your password">

            <br><br>

            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter your email">

            <br><br>

            <label>Date of Birth:</label>
            <input type="date" name="dob">

            <br><br>

            <label>File Upload:</label>
            <input type="file" name="file" required>

            <br><br>

            <label>Range:</label>
            <input type="range" name="range">

            <br><br>

            <label>Gender:</label>
            <input type="radio" name="male"> Male
            <input type="radio" name="Female">Female


            <br><br>
            <Label>Checkboxes</Label>
            <input type="checkbox" name="html"> HTML
            <input type="checkbox" name="css"> CSS
            <input type="checkbox" name="js"> JavaScript


            <br><br>
            <label>DropDown:</label>
            <select name="dropdown">
                <option value="">-------------Select Current Courses's-------------</option>
                <option value="option1">Option 1</option>
                <option value="option2">Option 2</option>
                <option value="option3">Option 3</option>
            </select>


            <br><br>
            <label>Address:</label>
            <textarea name="message" placeholder="Enter your address" cols="50"  rows="10"></textarea>

            <br><br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
         </form>
    </body>
</html>
