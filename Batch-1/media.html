<!DOCTYPE html>
<html>

<head>
    <title>HTML Media Example</title>
</head>

<body>

    <h1>HTML5 Media Elements</h1>

    <h2>Image Example</h2>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRNPLfNeQTG_44UrGFHJGAPkGEi7Rnj17KpMg&s" alt="Sample Image">

    <h2>Audio Example</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h2>Video Example</h2>
    <video width="320" height="240" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

</body>

</html>
