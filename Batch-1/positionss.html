<!DOCTYPE html>
<html>
    <head>
        <title>position</title>
        <style>
            .box{
                height: 400px;
                width: 400px;
                background-color: red;
                position: relative; 
                top: 100px;
                left: -50px;
            }
            .child{
                height: 200px;
                width: 200px;
                background-color: white;
                position: absolute;
                top: 20px;
                left: 20px;
            }
            .parent{
    
                background-color: white;
                position:fixed;
            }

            .fixed-box{
                height: 100px;
                width: 100%;
                background-color: red;
                position: fixed;
                bottom: 0;
            }
            .sticky-box{
                height: 100px;
                width: 100%;
                position: sticky;
                top: 100px;
                background-color: blue;
            }

        </style>
    </head>
    <body>
        <div class="box">
            <div class="child"></div>
        </div>
