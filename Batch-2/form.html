<html>
    <head>
        <title>FORMS</title>
    </head>
    <body>
        <form>
            <label>Name:</label>
            <input type="text" placeholder="Enter your name" autofocus required>

            <input type="number" placeholder="Enter your age">
            <input type="tel" placeholder="Enter your phone number" maxlength="10">
            <input type="password" placeholder="Enter your password">
            <input type="email" placeholder="Enter your email">
            <input type="date">
            <input type="file">
            <input type="range" min="0" max="50"><br>
            <input type="radio">Male
            <input type="radio">Female <br><br>

            <input type="checkbox">HTML
            <input type="checkbox">CSS
            <input type="checkbox">JS 
            <br>


            <select>
                <option>Select your skills</option>
                <option>C</option>
                <option>Java</option>
                <option>Python</option>
            </select>

            <br><br>

            <textarea placeholder="Enter your address"
             rows="10" cols="45"
             minlength="10" maxlength="15"
            ></textarea>
            
            <br><br>

            <center>
            <input type="submit">
            </center>
            <input type="reset">


            <br><br>
            <label>Date of Birth:</label>
            <input type="text" placeholder="Day" maxlength="2">-
            <input type="text" placeholder="Month" maxlength="2">-
            <input type="text" placeholder="Year" maxlength="4">
            <i>DD-MM-YYYY</i>


        </form>
    </body>
</html>
