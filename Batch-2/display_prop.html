<html>
    <head>
        <title>DISPLAY PROPERTIES</title>
        <style>
            .main{
                height: 200px;
                width: 600px;
                background-color: orange;
                border: 2px solid black;
                font-size: 50px;
                color: white;
                text-align: center;
                display: inline-block;
                margin-top: 20px;
                margin-left: 20px;
            }
            span{
                height: 200px;
            }
            h1{
                display: inline-block;
            }
        </style>
    </head>
    <body>
        <h1>Hello</h1>
        <h1>CSS</h1>
        <div class="main">1</div>
        <div class="main">2</div>
        <div class="main">3</div>

        <span>Hi</span>
        <span>Hello</span>
    </body>
</html>
