<html>
    <head>
        <title>FlexBox</title>
        <style>
            .container{
                height: 600px;
                width: 1200px;
                border: 3px solid black;
                padding: 10px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: space-evenly;
                gap: 20px;
            }
            .sub1{
                height: 350px;
                width: 220px;
                background-color: red;
                border: 1px solid black;
            }
            .box{
                display: flex;
                justify-content: space-evenly;
                align-items: flex-end;
                border:4px solid rgb(117, 9, 249);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Our Food Menu</h1>
            <div class="box">
                <div class="sub1">1</div>
                <div class="sub1">2</div>
                <div class="sub1">3</div>
                <div class="sub1">3</div>
            </div>
        </div>
    </body>
</html>
