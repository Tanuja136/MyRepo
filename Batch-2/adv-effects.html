<html>
    <head>
        <title>Advanced Effects</title>
        <style>
            body{
                display: flex;
                justify-content: center;
                align-items: center;
                gap:20px;
            }
            .box1{
                height: 200px;
                width: 200px;
                background-color: red;
                transition: transform 0.5s ease-in-out;
            }
            .box1:hover{
                transform: scale(2.5) ;
            }
            .box2{
                height: 200px;
                width: 200px;
                background-color: blue;
            }
            .box2:hover {
                transform: rotate(105deg);
                transition: 0.5s;
                
            }
            .box3{
                height: 200px;
                width: 200px;
                background-color: green;  
            }
            .box3:hover {
                transform: translateX(50px); 
                transition: 0.5s;
            }
        </style>
    </head>
    <body>
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </body>
</html>
