<html>
    <head>
        <title>Task</title>
        <style>
            .parent {
                height: 400px;
                width: 400px;
                border: 2px solid black;
                border-radius: 50%;
            }
            .part1{
                height: 200px;
                width: 400px;
                /* border: 2px solid blue; */
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .part2{
                height: 200px;
                width: 400px;
                /* border: 2px solid rgb(236, 56, 7); */
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
            }
            .eye1{
                height: 80px;
                width:80px;
                border: 2px solid black;
                display: flex;
                align-items: center;
                justify-content: center;
                border-top-right-radius: 35px;
                border-bottom-left-radius: 35px;
            }
            
            .eye2{
                height: 80px;
                width:80px;
                border: 2px solid black;
                display: flex;
                align-items: center;
                justify-content: center;
                border-top-left-radius: 35px;
                border-bottom-right-radius: 35px;
            }
            .shape{
                height: 80px;
                width: 160px;
                border: 2px solid black;
                border-bottom-left-radius: 100px;
                border-bottom-right-radius: 100px;
                position: absolute;
                top: 30px;
            }
            .circle1{
                height: 30px;
                width: 30px;
                background-color: black;
                border-radius: 50%;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="part1">
                <div class="eye1">
                    <div class="circle1"></div>

                    </div>
                <div class="eye2">
                    <div class="circle1"></div>

                    </div>
            </div>
            <div class="part2">
                <div class="shape"></div>
            </div>
        </div>
    </body>
</html>
