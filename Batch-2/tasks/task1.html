<html>
    <head>
        <title>Flexbox task</title>
        <style>
            .container {
                height: 400px;
                width:  600px;
                border: 2px solid black;
            }
            .box1 {
                height: 50px;
                width:600px;
                background-color: rgb(15, 231, 69);
            }
            .box2 {
                height: 150px;
                width: 600px;
                background-color: orange;
                display: flex;
            }
            .box3{
                height: 100px;
                width: 600px;
                background-color: yellow;
                display: flex;
            }
            .box4{
                height: 100px;
                width: 600px;
                background-color: blue;
                display: flex;
            }
            .b2-1{
                height: 150px;
                width: 200px;
                background-color: grey;
            }
            .c11{
                height: 100px;
                width: 200px;
                background-color: black;
            }
            .c12{
                height: 50px;
                width: 200px;
                background-color: rgb(4, 172, 88);
            }
            .c21{
                height: 75px;
                width: 200px;
                background-color: rgb(74, 196, 241);
            }
            .c22{
                height : 75px;
                width: 200px;
                background-color: violet;
            }
            .c31{
                height: 50px;
                width: 200px;
                background-color: yellow;
            }
            .c32{
                height: 100px;
                width: 200px;
                background-color: green;
            }
            .b3-1{
                height: 100px;
                width: 150px;
                background-color: rgb(244, 151, 151);
            }
            .b3-2{
                height: 100px;
                width: 300px;
                background-color: aqua;
            }
            .b3-3{
                height: 100px;
                width: 150px;
                background-color: brown;
            }
            .b4-1{
                height: 100px;
                width: 300px;
                background-color: red;
            }
            .b4-2{
                height: 100px;
                width: 300px;
                background-color: rgb(241, 12, 180);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="box1"></div>
            <div class="box2">
                <div class="b2-1">
                    <div class="c11"></div>
                    <div class="c12"></div>
                </div>
                <div class="b2-1">
                    <div class="c21"></div>
                    <div class="c22"></div>
                </div>
                <div class="b2-1">
                    <div class="c31"></div>
                    <div class="c32"></div>
                </div>
            </div>
            <div class="box3">
                <div class="b3-1">1</div>
                <div class="b3-2">2</div>
                <div class="b3-3">3</div>
            </div>
            <div class="box4">
                <div class="b4-1">1</div>
                <div class="b4-2">2</div>
            </div>
        </div>
    </body>
</html>
